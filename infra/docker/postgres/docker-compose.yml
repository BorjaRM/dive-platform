services:
  postgres:
    image: postgres:18
    container_name: dive-platform-postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dive_spike
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dive_spike"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - ../../../.volumes/postgres:/var/lib/postgresql/data
