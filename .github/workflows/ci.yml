name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Checkout PR branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_DASHBOARD_REQUEST_TIMEOUT_MS: 15000
        run: pnpm build

      - name: Verify Drizzle schema metadata
        run: |
          pnpm db:generate
          generated_changes="$(git status --porcelain -- packages/database/drizzle)"
          if [[ -n "$generated_changes" ]]; then
            printf '%s\n' "$generated_changes"
            exit 1
          fi

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dive_spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dive_spike"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      SPIKE_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dive_spike
      SPIKE_APP_DATABASE_URL: postgres://dive_app:dive_app@127.0.0.1:5432/dive_spike
      SPIKE_WORKER_DATABASE_URL: postgres://dive_worker:dive_worker@127.0.0.1:5432/dive_spike
      SPIKE_PLATFORM_ADMIN_DATABASE_URL: postgres://dive_platform_admin:dive_platform_admin@127.0.0.1:5432/dive_spike
      APP_DATABASE_URL: postgres://dive_app:dive_app@127.0.0.1:5432/dive_spike
      WORKER_DATABASE_URL: postgres://dive_worker:dive_worker@127.0.0.1:5432/dive_spike
      SPIKE_APP_PASSWORD: dive_app
      SPIKE_MIGRATION_PASSWORD: dive_migration
      MIGRATION_DATABASE_URL: postgres://dive_migration:dive_migration@127.0.0.1:5432/dive_spike
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build database test dependencies
        run: pnpm --filter @dive-center/database... build

      - name: Bootstrap database roles
        run: pnpm db:bootstrap

      - name: Apply product migrations
        run: pnpm db:migrate

      - name: Database integration and API e2e tests
        run: pnpm test:integration
