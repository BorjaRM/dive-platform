name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Checkout PR branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply Biome format and lint
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm check:fix

      - name: Commit Biome fixes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Biome fixes to commit"
            exit 0
          fi
          git commit -m "chore: apply biome format and lint"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dive_spike
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dive_spike"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      SPIKE_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/dive_spike
      SPIKE_APP_DATABASE_URL: postgres://dive_app:dive_app@127.0.0.1:5432/dive_spike
      APP_DATABASE_URL: postgres://dive_app:dive_app@127.0.0.1:5432/dive_spike
      SPIKE_APP_PASSWORD: dive_app
      SPIKE_MIGRATION_PASSWORD: dive_migration
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:integration
