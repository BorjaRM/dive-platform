name: Spec governance

on:
  pull_request:
    paths:
      - "specs/**"
      - "scripts/validate-spec-governance.mjs"
      - "scripts/validate-spec-governance.test.mjs"
      - "scripts/fixtures/spec-governance/**"
      - ".github/workflows/spec-governance.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-spec-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate all specifications
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/validate-spec-governance.mjs --all

      - name: Test governance validator
        run: node --test scripts/validate-spec-governance.test.mjs